<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#2D3A2F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="營建日報表" />
  <title>營建工程管理日報表 - MOYA UI/UX Pro Max 版</title>

<body>
  <div id="app-root" class="app-shell"></div>
  <script src="./app.js?v=8"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=8').then(reg => {
          reg.update();
        }).catch(() => {});
      });
    }
  </script>
</body>
